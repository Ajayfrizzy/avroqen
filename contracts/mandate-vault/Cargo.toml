[package]
name = "mandate-vault"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }

[dev-dependencies]
sha2 = "=0.10.9"
anyhow = "=1.0.104"
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
near-workspaces = "=0.24.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
